# ─── BrowserStack Automate — Configuración de pruebas de seguridad frontend ───
# Documentación: https://www.browserstack.com/docs/automate/playwright/configuration

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

# Nombre del proyecto y de la build
projectName: "SmartDiningRoom Security Tests"
buildName: "Security - Frontend Headers & Auth Flow"
buildTag: "security"

# URL de la aplicación: usa BrowserStack Local Tunnel para acceder a localhost
# El tunnel debe estar activo antes de correr las pruebas.
# Ver: https://www.browserstack.com/local-testing/automate
local: true
localIdentifier: "smartdiningroom-local"

# ─── Navegadores y plataformas a cubrir ──────────────────────────────────────
browsers:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 11

  - browser: firefox
    browser_version: latest
    os: OS X
    os_version: Sonoma

  - browser: edge
    browser_version: latest
    os: Windows
    os_version: 10

  - browser: safari
    browser_version: latest
    os: OS X
    os_version: Ventura

# ─── Opciones de Playwright ──────────────────────────────────────────────────
playwrightVersion: "1.44.0"

# ─── Configuración de la ejecución ───────────────────────────────────────────
parallelsPerPlatform: 1
retryFailedTests: 1

# ─── Timeouts ─────────────────────────────────────────────────────────────────
testTimeout: 30000

# ─── Archivos de test ─────────────────────────────────────────────────────────
testPaths:
  - "security.test.ts"
