extLength="114.7121" x="343.09" y="438.277">&#8226; LOGIN, REGISTER</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.9092" x="343.09" y="455.983">&#8226; CREATE_PAYMENT, VERIFY_PAYMENT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.0421" x="343.09" y="473.689">&#8226; REGISTER_MEAL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.9783" x="343.09" y="491.395">&#8226; CREATE_STUDENT, UPDATE_STUDENT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.3482" x="343.09" y="509.101">&#8226; CREATE_SUPERVISOR, etc.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="343.09" y="526.807">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.13" x="343.09" y="544.5131">IP</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.0481" x="359.6" y="544.5131">desde x-forwarded-for o socket</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="48" id="ent0011"><path d="M471.91,183.1379 L471.91,237.2579 L412.56,241.2579 L471.91,245.2579 L471.91,299.374 A0,0 0 0 0 471.91,299.374 L715.4702,299.374 A0,0 0 0 0 715.4702,299.374 L715.4702,193.1379 L705.4702,183.1379 L471.91,183.1379 A0,0 0 0 0 471.91,183.1379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M705.4702,183.1379 L705.4702,193.1379 L715.4702,193.1379 L705.4702,183.1379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.023" x="477.91" y="202.0349">logAction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2281" x="543.313" y="202.0349">&#8212; acciones de usuario</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.2131" x="477.91" y="219.7409">logSystemAction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.0261" x="590.5031" y="219.7409">&#8212; acciones del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.5642" x="477.91" y="237.447">sistema (cron, middleware HTTP)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="477.91" y="255.153">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.3492" x="477.91" y="272.859">Errores capturados silenciosamente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.5602" x="477.91" y="290.565">para no interrumpir el flujo principal</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="57" id="ent0014"><path d="M775.17,200.8479 L775.17,281.672 A0,0 0 0 0 775.17,281.672 L1044.1972,281.672 A0,0 0 0 0 1044.1972,281.672 L1044.1972,210.8479 L1034.1972,200.8479 L865.95,200.8479 L759.05,114.4779 L857.95,200.8479 L775.17,200.8479 A0,0 0 0 0 775.17,200.8479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1034.1972,200.8479 L1034.1972,210.8479 L1044.1972,210.8479 L1034.1972,200.8479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.6752" x="781.17" y="219.7449">Se ejecuta en TODAS las rutas /api/*</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.0892" x="781.17" y="237.4509">Registra: method, path, statusCode,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.0272" x="781.17" y="255.157">elapsedMs, role, query y body sanitizado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.3812" x="781.17" y="272.863">(redacta passwords, tokens, etc.)</text></g><!--link AuditService to AuditLog--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk5"><path codeLine="32" d="M209.69,284.6479 C209.69,308.2379 209.69,332.6779 209.69,361.9279" fill="none" id="AuditService-to-AuditLog" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="209.69,367.9279,213.69,358.9279,209.69,362.9279,205.69,358.9279,209.69,367.9279" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.849" x="210.69" y="339.2749">escribe</text></g><!--link EventAuditMiddleware to AuditService--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="33" id="lnk6"><path codeLine="33" d="M613.7,114.5779 C536.07,138.7279 435.7894,169.9262 351.8294,196.0362" fill="none" id="EventAuditMiddleware-to-AuditService" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="346.1,197.8179,355.8818,198.9649,350.8745,196.3331,353.5062,191.3258,346.1,197.8179" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.554" x="526.36" y="154.0349">usa</text></g><?plantuml-src RLJ1Jjj04BtxAqRg1Lgd81MgDa8WDp4GYK0K9qYSqCOxX2NshjbT0m4XyH7zWbwhddhi3Vw4B-ciupWEn3d4ddtpziticpKJ8JEcMGfnmem9hDLYb5lin4f6uXvXqpCL95LInPTQfGWNB35OMngnU3BMAfUyfHAbuSD-w7urHA2rkYqNlnHFRR7bDl-XD4TTGhQBvntatJRVzh_l1pMOL1mDPl2rBbmpEN71xKtFiy8c25iRM_3wz1E2d0khzCiVreGZDJR04OBOYXl16VUyeYap4At2WmVmQJZij45mznfHj-GOSi7X-NSmR3UU_rM8tA3kBA4e4APC9BKOewsKh0KuMaAOlLf8P07d6iqis6OM8TP8VpomtkEInWZrZOXnflF1M6P5_0Y96WV5FcipJVv2YbygyAkDV